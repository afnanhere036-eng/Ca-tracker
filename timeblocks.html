<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>Time Blocks | CA Foundation</title>
<style>
:root{color-scheme:dark;--bg:#101114;--surface:#202023;--surface2:#38383b;--ink:#f6f5f7;--muted:#a5a3ad;--accent:#f58b8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding-top:env(safe-area-inset-top)}
.schedule-head{padding:20px 16px 10px}.month-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.month-actions{display:flex;align-items:center;gap:8px}.home-link{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 10px;border-radius:11px;background:#ffffff0b;color:#d9d6df;text-decoration:none;font-size:13px;font-weight:650}.home-link:focus-visible,.calendar-wrap:focus-within{outline:2px solid var(--accent);outline-offset:2px}.month-title{font-size:clamp(23px,6vw,34px);font-weight:760;letter-spacing:-.7px;white-space:nowrap}.month-title span{color:var(--accent)}.calendar-wrap{position:relative;width:42px;height:42px;flex:none;display:grid;place-items:center;color:var(--accent);font-size:24px;border-radius:12px;background:#ffffff0b;cursor:pointer}.calendar-wrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
/* The strip contains many dates but each cell is one seventh of its viewport, so seven are visible at once and can be swiped horizontally. */
.date-strip{display:flex;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x;padding:13px 0 10px}.date-strip::-webkit-scrollbar{display:none}.date-button{flex:0 0 14.2857%;min-width:0;scroll-snap-align:center;border:0;background:transparent;color:var(--muted);padding:4px 1px 5px;text-align:center;cursor:pointer}.date-button .weekday{display:block;font-size:12px}.date-button .day-number{display:grid;place-items:center;width:min(40px,calc((100vw - 42px)/7));aspect-ratio:1;margin:5px auto 4px;color:var(--ink);font-size:18px;font-weight:650;border-radius:50%}.date-button.selected .day-number{background:var(--accent);color:white}.date-button .dots{height:8px;display:flex;justify-content:center;gap:3px}.date-button .dots i{width:7px;height:7px;border-radius:50%}.date-button:focus-visible{outline:2px solid var(--accent)}
.day-title{padding:0 17px 12px;color:var(--muted);font-size:14px}.timeline-scroll{height:calc(100dvh - 211px);min-height:360px;overflow:auto;overscroll-behavior:contain;background:var(--surface2);border-radius:32px 32px 0 0;scrollbar-width:thin;scrollbar-color:#626269 transparent}.timeline{position:relative;min-height:240px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 71px,#ffffff08 71px,#ffffff08 72px)}.hour-line{position:absolute;left:0;right:0;height:1px;border-top:1px solid #ffffff12}.hour-line span{position:absolute;left:0;top:-11px;width:62px;padding-left:12px;background:var(--surface2);color:#aaa7b1;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.hour-line::after{content:"";position:absolute;left:62px;right:0;top:0;border-top:1px solid #ffffff0b}.events{position:absolute;inset:0 0 0 68px}.events.connect::before{content:"";position:absolute;z-index:0;left:39px;top:var(--connect-top);height:var(--connect-height);width:5px;border-radius:5px;background:repeating-linear-gradient(to bottom,var(--accent) 0 12px,transparent 12px 20px);opacity:.9}.event{position:absolute;left:7px;right:12px;display:grid;grid-template-columns:74px minmax(0,1fr) 34px;align-items:center;gap:11px;z-index:1}.event-rail{align-self:stretch;min-height:58px;border-radius:42px;background:var(--block-bg);color:white;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 14px #0002}.event-rail::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,#ffffff22,transparent 72%)}.event-symbol{z-index:1;font-size:var(--icon-size,25px);line-height:1}.event-copy{min-width:0}.event-time{font-size:clamp(12px,3.8vw,16px);color:#c1bec8;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-name{font-size:clamp(17px,5vw,25px);font-weight:680;line-height:1.2;overflow-wrap:anywhere}.event-check{width:30px;height:30px;border:3px solid var(--block-border);border-radius:50%;background:transparent;padding:0;color:#fff;font-size:16px;display:grid;place-items:center;cursor:pointer}.event-check:focus-visible{outline:2px solid white;outline-offset:2px}.event.done .event-rail{filter:saturate(.6);opacity:.72}.event.done .event-name{text-decoration:line-through;color:#c5c1ca}.event.done .event-check{background:var(--block-border);color:#202023}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#c1bec8}.add-button{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:5;width:64px;height:64px;border:0;border-radius:50%;background:var(--accent);color:white;box-shadow:0 8px 24px #0007;font-size:38px;line-height:1;display:grid;place-items:center;text-decoration:none}.add-button:focus-visible{outline:3px solid white;outline-offset:3px}
@media(max-width:480px){.schedule-head{padding:17px 12px 9px}.month-title{font-size:23px}.home-link{min-height:35px;padding:0 8px;font-size:12px}.calendar-wrap{width:38px;height:38px;font-size:21px}.date-button .weekday{font-size:11px}.date-button .day-number{width:min(36px,calc((100vw - 34px)/7));font-size:16px}.timeline-scroll{height:calc(100dvh - 199px)}.events{left:58px}.event{left:4px;right:8px;grid-template-columns:62px minmax(0,1fr) 32px;gap:8px}.event-check{width:28px;height:28px;border-width:3px;font-size:14px}.add-button{width:60px;height:60px;right:17px;bottom:max(18px,env(safe-area-inset-bottom));font-size:35px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="schedule-head">
    <div class="month-row"><div class="month-title" id="month-title"></div><div class="month-actions"><a class="home-link" href="index.html" aria-label="Go back to home">⌂ Home</a><label class="calendar-wrap" aria-label="Choose a date from calendar">▣<input id="calendar-date" type="date" aria-label="Choose a specific date"></label></div></div>
    <nav class="date-strip" id="date-strip" aria-label="Swipe horizontally to choose a date"></nav>
  </header>
  <div class="day-title" id="day-title"></div>
  <section class="timeline-scroll" aria-label="Schedule timeline"><div class="timeline" id="timeline"><div class="events" id="events"></div></div></section>
</main>
<a class="add-button" id="add-button" href="create-timeblock.html" aria-label="Create a time block">+</a>
<script>
(function(){
  "use strict";
  var KEY="ca-checklist-timeblocks-v1";
  var COLORS=[{id:"lavender",bg:"#a18de8",dot:"#a997ff",icon:"✦"},{id:"blue",bg:"#609bd0",dot:"#6eb6ff",icon:"✦"},{id:"teal",bg:"#4ba99c",dot:"#5dd4c1",icon:"✦"},{id:"green",bg:"#83ae59",dot:"#a6d66e",icon:"✦"},{id:"yellow",bg:"#d6a843",dot:"#f1c15f",icon:"✦"},{id:"orange",bg:"#dd8155",dot:"#ff9b65",icon:"✦"},{id:"pink",bg:"#e47e91",dot:"#ed8db9",icon:"✦"},{id:"red",bg:"#d85e69",dot:"#ff858b",icon:"✦"}];
  var data={blocks:[],checks:{}};
  try{var saved=JSON.parse(localStorage.getItem(KEY)||"{}");if(Array.isArray(saved.blocks))data.blocks=saved.blocks;if(saved.checks&&typeof saved.checks==="object")data.checks=saved.checks;}catch(e){}
  function localDate(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function dateFrom(value){return new Date(value+"T12:00:00");}
  var selected=new URLSearchParams(location.search).get("date");if(!/^\d{4}-\d{2}-\d{2}$/.test(selected||""))selected=localDate(new Date());
  function minutes(value){var p=value.split(":");return Number(p[0])*60+Number(p[1]);}
  function clock(n){var h=Math.floor(n/60),m=n%60;return String(h%12||12).padStart(2,"0")+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM");}
  function color(id){return COLORS.find(function(c){return c.id===id;})||COLORS[0];}
  function applies(block,date){if(block.repeat==="daily")return true;if(block.repeat==="weekdays")return Array.isArray(block.days)&&block.days.indexOf(dateFrom(date).getDay())!==-1;return block.date===date;}
  function safe(value){var node=document.createElement("span");node.textContent=value;return node.innerHTML;}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}}
  function pickDate(date){selected=date;history.replaceState(null,"","?date="+encodeURIComponent(date));render();}
  function buildStrip(){
    var strip=document.getElementById("date-strip");strip.replaceChildren();var anchor=dateFrom(selected),start=new Date(anchor);start.setDate(start.getDate()-14);
    for(var i=0;i<29;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);var value=localDate(d),scheduled=data.blocks.filter(function(b){return applies(b,value);});
      var button=document.createElement("button");button.type="button";button.className="date-button"+(value===selected?" selected":"");button.setAttribute("aria-pressed",value===selected);button.setAttribute("aria-label",d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}));
      button.innerHTML='<span class="weekday">'+d.toLocaleDateString(undefined,{weekday:"short"})+'</span><span class="day-number">'+d.getDate()+'</span><span class="dots">'+scheduled.slice(0,4).map(function(b){return '<i style="background:'+color(b.color).dot+'"></i>';}).join("")+'</span>';
      button.addEventListener("click",function(date){return function(){pickDate(date);};}(value));strip.appendChild(button);
    }
    var selectedButton=strip.querySelector(".selected");if(selectedButton)selectedButton.scrollIntoView({block:"nearest",inline:"center"});
  }
  function render(){
    var date=dateFrom(selected),items=data.blocks.filter(function(b){return applies(b,selected);}).sort(function(a,b){return minutes(a.start)-minutes(b.start);});
    document.getElementById("month-title").innerHTML=safe(date.toLocaleDateString(undefined,{month:"long"}))+" <span>"+date.getFullYear()+"</span>";
    document.getElementById("day-title").textContent=date.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
    document.getElementById("calendar-date").value=selected;document.getElementById("add-button").href="create-timeblock.html?date="+encodeURIComponent(selected);buildStrip();
    var timeline=document.getElementById("timeline"),events=document.getElementById("events");events.replaceChildren();events.classList.remove("connect");Array.from(timeline.querySelectorAll(".hour-line")).forEach(function(line){line.remove();});
    if(!items.length){timeline.style.height="480px";events.style.height="480px";var empty=document.createElement("div");empty.className="empty";empty.textContent="No time blocks for this date. Tap + to add one.";events.appendChild(empty);return;}
    var earliest=Math.min.apply(null,items.map(function(b){return minutes(b.start);})),latest=Math.max.apply(null,items.map(function(b){return minutes(b.end);}));
    var scale=1.2,top=earliest,span=Math.max(latest-earliest,60),total=span*scale+64;timeline.style.height=total+"px";events.style.height=total+"px";
    // The first time label begins at the earliest scheduled block, not at midnight.
    for(var offset=0;offset<=span;offset+=60){var at=top+offset,line=document.createElement("div");line.className="hour-line";line.style.top=(offset*scale+16)+"px";line.innerHTML="<span>"+clock(at)+"</span>";timeline.insertBefore(line,events);}
    var firstCenter=null,lastCenter=null;
    items.forEach(function(block){
      var start=minutes(block.start),end=minutes(block.end),y=(start-top)*scale+16,duration=(end-start)*scale,done=!!data.checks[selected+"|"+block.id],c=color(block.color),event=document.createElement("article");
      event.className="event"+(done?" done":"");event.style.top=y+"px";event.style.height=duration+"px";event.style.setProperty("--block-bg",c.bg);event.style.setProperty("--block-border",c.dot);event.style.setProperty("--icon-size",Math.min(58,Math.max(23,22+duration*.055))+"px");
      event.innerHTML='<div class="event-rail" aria-hidden="true"><span class="event-symbol">'+c.icon+'</span></div><div class="event-copy"><div class="event-time">'+clock(start)+" – "+clock(end)+" ("+(end-start)+"m)"+'</div><div class="event-name">'+safe(block.name)+'</div></div><button class="event-check" type="button" aria-pressed="'+done+'" aria-label="'+(done?"Mark "+safe(block.name)+" incomplete":"Complete "+safe(block.name))+'">'+(done?"✓":"")+'</button>';
      event.querySelector(".event-check").addEventListener("click",function(id){return function(){var key=selected+"|"+id;if(data.checks[key])delete data.checks[key];else data.checks[key]=true;persist();render();};}(block.id));events.appendChild(event);
      var center=y+duration/2;if(firstCenter===null)firstCenter=center;lastCenter=center;
    });
    if(items.length>1){events.classList.add("connect");events.style.setProperty("--connect-top",firstCenter+"px");events.style.setProperty("--connect-height",Math.max(0,lastCenter-firstCenter)+"px");}
  }
  document.getElementById("calendar-date").addEventListener("change",function(event){if(event.target.value)pickDate(event.target.value);});
  document.getElementById("date-strip").addEventListener("wheel",function(event){if(Math.abs(event.deltaY)>Math.abs(event.deltaX)){this.scrollLeft+=event.deltaY;event.preventDefault();}},{passive:false});
  render();
})();
</script>
</body>
</html>
